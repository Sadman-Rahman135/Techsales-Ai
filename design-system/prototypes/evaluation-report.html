<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluation Report: prototype</title>
<!-- Static prototype for design-system/pages/evaluation-report.md and docs/evaluation.md.
     All numbers are ILLUSTRATIVE SAMPLE DATA, not measured results. Chart tokens: MASTER.md §10. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --surface-muted: #F1F5F9;
    --fg: #0F172A; --fg-muted: #475569;
    --accent: #0369A1; --on-accent: #FFFFFF;
    --success: #047857; --warning: #B45309; --danger: #B91C1C;
    --border: #E2E8F0; --border-strong: #64748B; --ring: #0369A1;
    --mark-pass: #047857; --mark-fail: #B91C1C; --mark-series: #0369A1; --mark-track: #E2E8F0; --mark-target: #0F172A;
    --shadow-sm: 0 1px 2px rgb(15 23 42 / .06);
    --font-heading: "Lexend", ui-sans-serif, system-ui, sans-serif;
    --font-sans: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0B1220; --surface: #151E2E; --surface-muted: #1C2738;
    --fg: #F1F5F9; --fg-muted: #A3B1C6;
    --accent: #38BDF8; --on-accent: #0B1220;
    --success: #34D399; --warning: #FBBF24; --danger: #F87171;
    --border: #273449; --border-strong: #7A8AA3; --ring: #38BDF8;
    --mark-pass: #059669; --mark-fail: #DC2626; --mark-series: #0284C7; --mark-track: #273449; --mark-target: #F1F5F9;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100dvh; background: var(--bg); color: var(--fg); font: 400 16px/1.625 var(--font-sans); -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.lucide { width: 20px; height: 20px; stroke-width: 2; flex: none; }
  .ico-16 svg.lucide, svg.lucide.ico-16 { width: 16px; height: 16px; }
  [hidden] { display: none !important; }

  .proto-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; font-size: 14px; color: var(--fg-muted); background: var(--surface-muted); border-bottom: 1px dashed var(--border-strong); }
  .proto-bar strong { color: var(--fg); }

  /* App shell */
  .shell { display: grid; grid-template-columns: 1fr; min-height: calc(100dvh - 40px); }
  @media (min-width: 1024px) { .shell { grid-template-columns: 232px 1fr; } }
  .sidebar { display: none; border-right: 1px solid var(--border); background: var(--surface); padding: 16px 12px; flex-direction: column; gap: 4px; }
  @media (min-width: 1024px) { .sidebar { display: flex; } }
  .sidebar.open { display: flex; position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 50; box-shadow: 0 12px 32px rgb(15 23 42 / .2); }
  .brand { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px 12px; font: 600 18px/1 var(--font-heading); }
  .brand-mark { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--fg); color: var(--bg); }
  .brand-mark svg.lucide { width: 18px; height: 18px; }
  .nav a { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--fg-muted); text-decoration: none; font-weight: 600; }
  .nav a:hover { background: var(--surface-muted); color: var(--fg); }
  .nav a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
  .sidebar .foot { margin-top: auto; border-top: 1px solid var(--border); padding-top: 8px; }

  .topbar { display: flex; align-items: center; gap: 8px; min-height: 60px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 20; }
  .topbar h1 { font: 600 20px/28px var(--font-heading); margin: 0; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .role { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 20px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg-muted); }
  .icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 8px; border: 0; background: none; color: var(--fg-muted); }
  .icon-btn:hover { background: var(--surface-muted); color: var(--fg); }
  .menu-btn { display: inline-grid; } @media (min-width: 1024px) { .menu-btn { display: none; } }

  main { min-width: 0; }
  .content { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 0 -16px 24px; padding: 0 16px; }
  .tabs a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; color: var(--fg-muted); text-decoration: none; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs a[aria-current="page"] { color: var(--fg); border-color: var(--accent); }

  /* Filter row + run meta */
  .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .field select { min-height: 44px; min-width: 260px; max-width: 100%; padding: 0 36px 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); }
  .run-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--fg-muted); }
  .run-meta code { font: 13px/1.4 ui-monospace, "JetBrains Mono", monospace; color: var(--fg); }

  /* Verdict banner */
  .verdict { display: flex; gap: 16px; align-items: flex-start; padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); margin-bottom: 32px; border-left: 4px solid var(--danger); }
  .verdict.ok { border-left-color: var(--success); }
  .verdict .v-icon { color: var(--danger); margin-top: 2px; } .verdict.ok .v-icon { color: var(--success); }
  .verdict .v-icon svg.lucide { width: 24px; height: 24px; }
  .verdict h2 { font: 600 20px/28px var(--font-heading); margin: 0 0 4px; }
  .verdict p { margin: 0; color: var(--fg-muted); }
  .tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding: 0; list-style: none; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; line-height: 20px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge svg.lucide { width: 14px; height: 14px; }
  .badge.pass { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
  .badge.fail { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .badge.not_run, .badge.no_target { color: var(--fg-muted); background: var(--surface-muted); }
  .chip { font-size: 12px; line-height: 18px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--fg-muted); }

  /* Gate list */
  h2.section { font: 600 18px/26px var(--font-heading); margin: 0 0 12px; }
  .group-label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg-muted); margin: 16px 0 8px; }
  .gates { list-style: none; margin: 0 0 40px; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .gate + .gate { border-top: 1px solid var(--border); }
  .gate-btn { width: 100%; border: 0; background: none; text-align: left; padding: 16px 20px; display: grid; gap: 8px 24px; grid-template-columns: 1fr; align-items: center; min-height: 44px; }
  .gate-btn:hover { background: var(--surface-muted); }
  @media (min-width: 768px) { .gate-btn { grid-template-columns: minmax(220px, 1.1fr) minmax(240px, 1.4fr) auto; } }
  .g-name { display: flex; flex-direction: column; gap: 4px; }
  .g-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 600; }
  .g-id { font: 12px/1 ui-monospace, monospace; color: var(--fg-muted); }
  .g-desc { font-size: 14px; color: var(--fg-muted); line-height: 20px; }
  .g-blocks { display: flex; gap: 4px; flex-wrap: wrap; }
  .g-value { display: flex; flex-direction: column; gap: 6px; }
  .g-number { font-weight: 600; } .g-number .sub { font-weight: 400; color: var(--fg-muted); font-size: 14px; }
  .chev { color: var(--fg-muted); justify-self: end; transition: transform 200ms cubic-bezier(0.2, 0, 0, 1); }
  @media (max-width: 767px) { .gate-btn { position: relative; padding-right: 48px; } .chev { position: absolute; top: 18px; right: 16px; } }
  .gate-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  /* Meter (bullet): honest 0-100% scale, target marker, value as text beside it */
  .meter { position: relative; height: 8px; border-radius: 4px; background: var(--mark-track); }
  .meter .fill { position: absolute; inset: 0 auto 0 0; border-radius: 4px; }
  .meter .fill.pass { background: var(--mark-pass); } .meter .fill.fail { background: var(--mark-fail); }
  .meter .target { position: absolute; top: -5px; width: 2px; height: 18px; background: var(--mark-target); border-radius: 1px; box-shadow: 0 0 0 2px var(--surface); }
  .meter-scale { position: relative; display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  .meter-scale .t { position: absolute; top: 0; transform: translateX(-50%); color: var(--fg); font-weight: 600; white-space: nowrap; }
  .meter-scale .t.at-end { transform: translateX(-100%); }

  .cases { padding: 0 20px 16px; }
  .cases table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .cases th, .cases td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
  .cases th { color: var(--fg-muted); font-weight: 600; }
  .cases code { font: 12px/1.4 ui-monospace, monospace; }
  .cases .empty { color: var(--fg-muted); font-size: 14px; margin: 0; }
  @media (max-width: 767px) {
    .cases thead { display: none; }
    .cases tr { display: block; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .cases td { display: block; border: 0; padding: 2px 0; }
    .cases td::before { content: attr(data-label) ": "; font-weight: 600; color: var(--fg-muted); }
  }

  /* Trends: small multiples */
  .trends { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 900px) { .trends { grid-template-columns: repeat(3, 1fr); } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .card-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
  .card-head h3 { font: 600 16px/24px var(--font-heading); margin: 0; }
  .card-head p { margin: 0; font-size: 14px; color: var(--fg-muted); line-height: 20px; }
  .card-head .toggle { margin-left: auto; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; position: relative; }
  .card-head .toggle::after { content: ""; position: absolute; inset: -4px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart:focus-visible { outline: 2px solid var(--ring); outline-offset: 4px; border-radius: 8px; }
  .chart .grid line { stroke: var(--mark-track); stroke-width: 1; }
  .chart .axis text { fill: var(--fg-muted); font: 12px var(--font-sans); font-variant-numeric: tabular-nums; }
  .chart .target-line { stroke: var(--fg-muted); stroke-width: 1; }
  .chart .series { fill: none; stroke: var(--mark-series); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chart .end-dot { fill: var(--mark-series); stroke: var(--surface); stroke-width: 2; }
  .chart .end-label { fill: var(--fg); font: 600 13px var(--font-sans); }
  .chart .xhair { stroke: var(--fg-muted); stroke-width: 1; }
  .chart .hover-dot { fill: var(--mark-series); stroke: var(--surface); stroke-width: 2; }
  .tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 18px; white-space: nowrap; transform: translate(-50%, -100%); box-shadow: 0 4px 12px rgb(0 0 0 / .2); }
  .tip strong { display: block; font-size: 15px; }
  .trend-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .trend-table th, .trend-table td { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); }
  .trend-table th { color: var(--fg-muted); font-weight: 600; }
  .scrim { position: fixed; inset: 0; background: rgb(15 23 42 / .55); z-index: 40; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0ms !important; animation: none !important; } }
</style>
</head>
<body>
<div class="proto-bar" role="note">
  <strong>Prototype</strong>
  <span>Illustrative sample data, not measured results.</span>
  <button class="icon-btn" id="theme" type="button" aria-label="Switch to dark theme" style="margin-left:auto"><i data-lucide="moon"></i></button>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Main">
    <div class="brand"><span class="brand-mark" aria-hidden="true"><i data-lucide="wrench"></i></span>TechCare</div>
    <div class="nav">
      <a href="#"><i data-lucide="message-square"></i>Assistant</a>
      <a href="#"><i data-lucide="files"></i>Documents</a>
      <a href="#" aria-current="page"><i data-lucide="gauge"></i>Quality</a>
      <a href="#"><i data-lucide="settings"></i>Settings</a>
    </div>
    <div class="foot nav"><a href="#"><i data-lucide="log-out"></i>Sign out</a></div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><i data-lucide="menu"></i></button>
      <h1>Quality</h1>
      <div class="right"><span class="role"><i data-lucide="badge-check" class="ico-16"></i>Manager</span></div>
    </div>

    <div class="content">
      <nav class="tabs" aria-label="Quality sections">
        <a href="#">Overview</a>
        <a href="#" aria-current="page">Evaluation</a>
      </nav>

      <div class="filters">
        <div class="field">
          <label for="run">Evaluation run</label>
          <select id="run"></select>
        </div>
        <div class="run-meta" id="run-meta"></div>
      </div>

      <section class="verdict" id="verdict" aria-live="polite"></section>

      <h2 class="section" id="gates-h">Acceptance gates</h2>
      <div id="gate-groups" aria-labelledby="gates-h"></div>

      <h2 class="section" id="trend-h">Trends across runs</h2>
      <div class="trends" id="trends" aria-labelledby="trend-h"></div>
    </div>
  </main>
</div>

<script>
/* ---------- Illustrative sample data (shape follows docs/evaluation.md §4) ---------- */
const RUNS = [
  { id: 'eval-0824', date: '24 Aug 2026', commit: '3f1e9a0' }, { id: 'eval-0831', date: '31 Aug 2026', commit: '8b27c41' },
  { id: 'eval-0907', date: '7 Sep 2026', commit: 'c90d1e2' }, { id: 'eval-0914', date: '14 Sep 2026', commit: '15aa07f' },
  { id: 'eval-0921', date: '21 Sep 2026', commit: '6e44b3d' }, { id: 'eval-0928', date: '28 Sep 2026', commit: 'd02f8c5' },
  { id: 'eval-1005', date: '5 Oct 2026', commit: '47c1a9e' }, { id: 'eval-1012', date: '12 Oct 2026', commit: 'a1b2c3d' },
];
// Ratio series per run: [numerator, denominator]
const SERIES = {
  G1: [[62,80],[66,80],[68,80],[67,80],[70,80],[73,80],[72,80],[73,80]],
  G2: [[45,50],[46,50],[46,50],[48,50],[48,50],[48,50],[48,50],[47,50]],
  G4: [[203,209],[207,209],[210,210],[211,211],[212,212],[212,212],[212,212],[212,212]],
};
const GATES = [
  { id: 'G1', name: 'Retrieval', desc: 'Finds the right page for answerable questions (Recall@5)', kind: 'ratio', target: .90, blocks: ['merge', 'release'] },
  { id: 'G2', name: 'Grounding', desc: 'Answer claims supported by the cited text (manual audit)', kind: 'ratio', target: .95, blocks: ['release'] },
  { id: 'G3', name: 'Abstention', desc: 'No invented policy when documents don’t cover the question', kind: 'zero', unit: 'invented answers', blocks: ['merge'],
    value: 1, n: 28, nUnit: 'unanswerable questions',
    cases: [{ id: 'unans-017', q: 'Do you price-match other stores?', expected: 'insufficient_evidence', got: 'Stated a 14-day price-match policy', trace: 'trace-9c41' }] },
  { id: 'G4', name: 'Citation validity', desc: 'Every citation points to a retrieved, authorized chunk', kind: 'ratio', target: 1, blocks: ['merge'] },
  { id: 'G5', name: 'Access control', desc: 'No employee-only or other-tenant content reaches the wrong user', kind: 'zero', unit: 'leaks', value: 0, n: 64, nUnit: 'probes', blocks: ['merge'] },
  { id: 'G6', name: 'Document lifecycle', desc: 'Old versions are never cited after a new one is published', kind: 'zero', unit: 'stale citations', value: 0, n: 12, nUnit: 'scenarios', blocks: ['merge'] },
  { id: 'G7', name: 'Reliability', desc: 'Retried ingestion creates no duplicate or orphaned chunks', kind: 'zero', unit: 'duplicates', value: 0, n: 10, nUnit: 'injected failures', blocks: ['merge'] },
  { id: 'G8', name: 'Operability', desc: 'A new developer can start the stack from the README', kind: 'check', status: 'not_run', blocks: ['release'] },
  { id: 'G9', name: 'Performance', desc: 'Latency of retrieval, first token and full answer', kind: 'perf', status: 'no_target', blocks: ['report'],
    perf: 'p50 1.9 s · p95 4.6 s full answer', note: 'SLO not agreed yet. Proposal: p95 ≤ 8 s' },
  { id: 'G10', name: 'Accessibility', desc: 'No serious axe-core violations on P0 screens (proposed gate)', kind: 'check', status: 'pass', blocks: ['merge'], perf: '0 violations · 7 routes · light + dark' },
];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const icon = (name, cls) => { const i = document.createElement('i'); i.dataset.lucide = name; if (cls) i.className = cls; return i; };
const pct = (v, d = 1) => (v * 100).toFixed(d).replace(/\.0$/, '') + '%';
function wilson(k, n, z = 1.96) {
  const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}
const STATUS = {
  pass: { icon: 'badge-check', label: 'Pass' }, fail: { icon: 'circle-x', label: 'Fail' },
  not_run: { icon: 'circle-dashed', label: 'Not run' }, no_target: { icon: 'circle-dashed', label: 'No target' },
};
const badge = (status) => { const b = el('span', 'badge ' + status); b.append(icon(STATUS[status].icon), STATUS[status].label); return b; };

/* ---------- compute gate results for a run ---------- */
function resultsFor(runIdx) {
  return GATES.map(g => {
    if (g.kind === 'ratio') {
      const [k, n] = SERIES[g.id][runIdx];
      const v = k / n, prev = runIdx > 0 ? SERIES[g.id][runIdx - 1][0] / SERIES[g.id][runIdx - 1][1] : null;
      return { ...g, k, n, v, ci: wilson(k, n), delta: prev == null ? null : v - prev, status: v >= g.target ? 'pass' : 'fail' };
    }
    if (g.kind === 'zero') return { ...g, status: g.value === 0 ? 'pass' : 'fail' };
    return { ...g };
  });
}

/* ---------- render: run selector + meta ---------- */
const runSel = $('#run');
RUNS.slice().reverse().forEach((r, i) => {
  const o = el('option', null, `${r.date} · ${r.id}${i === 0 ? ' (latest)' : ''}`); o.value = RUNS.length - 1 - i; runSel.append(o);
});
function renderMeta(r) {
  const m = $('#run-meta'); m.replaceChildren();
  [['Commit', r.commit], ['Dataset', 'golden-v1'], ['Models', 'configured LLM + embeddings']].forEach(([k, v]) => {
    const s = el('span'); s.append(k + ' '); s.append(el('code', null, v)); m.append(s);
  });
}

/* ---------- render: verdict ---------- */
function renderVerdict(res) {
  const v = $('#verdict'); v.replaceChildren();
  const fails = res.filter(r => r.status === 'fail'), mergeBlockers = fails.filter(r => r.blocks.includes('merge'));
  const count = s => res.filter(r => r.status === s).length;
  v.classList.toggle('ok', fails.length === 0);
  const ic = el('div', 'v-icon'); ic.append(icon(fails.length ? 'octagon-x' : 'badge-check'));
  const body = el('div');
  body.append(el('h2', null, fails.length ? `Not releasable: ${fails.length} gate${fails.length > 1 ? 's' : ''} failing` : 'All measured gates pass'));
  body.append(el('p', null, mergeBlockers.length
    ? `${mergeBlockers.map(r => `${r.id} ${r.name}`).join(', ')} also blocks merging to main. Fix before the next merge.`
    : fails.length ? 'Failing gates block the release, not merges.' : 'Gates that did not run are not counted as passing.'));
  const t = el('ul', 'tally');
  ['pass', 'fail', 'not_run', 'no_target'].forEach(s => { if (count(s)) { const li = el('li'); const b = badge(s); b.append(` ${count(s)}`); li.append(b); t.append(li); } });
  body.append(t);
  v.append(ic, body);
}

/* ---------- render: gates grouped (failing first) ---------- */
function gateValue(r) {
  const box = el('div', 'g-value');
  if (r.kind === 'ratio') {
    const num = el('div', 'g-number');
    num.append(`${r.k} / ${r.n} · ${pct(r.v)} `);
    const sub = el('span', 'sub', `95% CI ${pct(r.ci[0], 0)}–${pct(r.ci[1], 0)}`);
    num.append(sub);
    if (r.delta != null && Math.abs(r.delta) >= 0.0005) {
      const d = el('span', 'sub'); d.append(` · ${r.delta > 0 ? '+' : '−'}${(Math.abs(r.delta) * 100).toFixed(1)} pts vs previous`); num.append(d);
    }
    const meter = el('div', 'meter'); meter.setAttribute('aria-hidden', 'true');
    const fill = el('div', 'fill ' + r.status); fill.style.width = (r.v * 100) + '%';
    const tgt = el('div', 'target'); tgt.style.left = `calc(${r.target * 100}% - 1px)`;
    meter.append(fill, tgt);
    // Target label sits under its marker. The "100%" end label shows only when it can't collide with it;
    // a target at 100% right-aligns instead.
    const scale = el('div', 'meter-scale'); const atEnd = r.target >= 0.99;
    const tLabel = el('span', 't' + (atEnd ? ' at-end' : ''), `Target ${pct(r.target, 0)}`); tLabel.style.left = (r.target * 100) + '%';
    scale.append(el('span', null, '0%'), r.target <= 0.8 ? el('span', null, '100%') : el('span'), tLabel);
    box.append(num, meter, scale);
  } else if (r.kind === 'zero') {
    const unit = r.value === 1 ? r.unit.replace(/s$/, '') : r.unit;
    const num = el('div', 'g-number', `${r.value} ${unit} in ${r.n} ${r.nUnit}`);
    const sub = el('div', 'g-desc', r.value === 0 ? `True rate < ${pct(3 / r.n)} at 95% confidence` : 'Target: 0');
    box.append(num, sub);
  } else {
    box.append(el('div', 'g-number', r.perf || (r.status === 'not_run' ? 'No result for this commit' : '')));
    if (r.note) box.append(el('div', 'g-desc', r.note));
    if (r.status === 'not_run') box.append(el('div', 'g-desc', 'A gate that did not run is not a pass.'));
  }
  return box;
}
function caseTable(r) {
  const wrap = el('div', 'cases');
  if (!r.cases || !r.cases.length) { wrap.append(el('p', 'empty', r.status === 'pass' ? 'No failing cases.' : 'No case details for this gate.')); return wrap; }
  const t = el('table'); const cap = el('caption', 'sr-only', `Failing cases for ${r.name}`); t.append(cap);
  const head = el('thead'); const hr = el('tr'); ['Case', 'Question', 'Expected', 'Got', 'Trace'].forEach(h => hr.append(el('th', null, h))); head.append(hr);
  const tb = el('tbody');
  r.cases.forEach(c => {
    const tr = el('tr');
    [['Case', c.id, true], ['Question', c.q], ['Expected', c.expected, true], ['Got', c.got], ['Trace', c.trace, true]].forEach(([lab, val, mono]) => {
      const td = el('td'); td.dataset.label = lab; td.append(mono ? el('code', null, val) : document.createTextNode(val)); tr.append(td);
    });
    tb.append(tr);
  });
  t.append(head, tb); wrap.append(t); return wrap;
}
function renderGates(res) {
  const root = $('#gate-groups'); root.replaceChildren();
  const groups = [['Failing', res.filter(r => r.status === 'fail')], ['Needs attention', res.filter(r => r.status === 'not_run' || r.status === 'no_target')], ['Passing', res.filter(r => r.status === 'pass')]];
  groups.forEach(([label, items]) => {
    if (!items.length) return;
    const id = 'grp-' + label.toLowerCase().replace(/\s/g, '-');
    const h = el('h3', 'group-label', `${label} (${items.length})`); h.id = id;
    const ul = el('ul', 'gates'); ul.setAttribute('aria-labelledby', id);
    items.forEach(r => {
      const li = el('li', 'gate');
      const btn = el('button', 'gate-btn'); btn.type = 'button'; btn.setAttribute('aria-expanded', 'false');
      const panelId = 'cases-' + r.id; btn.setAttribute('aria-controls', panelId);
      const name = el('div', 'g-name'); const title = el('div', 'g-title');
      title.append(badge(r.status), el('span', null, r.name), el('span', 'g-id', r.id));
      const blocks = el('div', 'g-blocks'); r.blocks.forEach(b => blocks.append(el('span', 'chip', 'Blocks ' + b)));
      if (r.blocks[0] === 'report') blocks.replaceChildren(el('span', 'chip', 'Tracked only'));
      name.append(title, el('div', 'g-desc', r.desc), blocks);
      const chev = el('span', 'chev'); chev.append(icon('chevron-down'));
      btn.append(name, gateValue(r), chev);
      const panel = caseTable(r); panel.id = panelId; panel.hidden = true;
      btn.addEventListener('click', () => { const open = btn.getAttribute('aria-expanded') !== 'true'; btn.setAttribute('aria-expanded', open); panel.hidden = !open; });
      li.append(btn, panel); ul.append(li);
    });
    root.append(h, ul);
  });
}

/* ---------- render: trend small multiples (single series each, one axis) ---------- */
function trendChart(g, runIdx) {
  const card = el('section', 'card'); const hid = 'trend-' + g.id;
  const head = el('div', 'card-head'); const txt = el('div');
  const h = el('h3', null, `${g.name} (${g.id})`); h.id = hid;
  txt.append(h, el('p', null, `Last ${runIdx + 1} runs · axis ${g.id === 'G4' ? '90' : '70'}–100% · grey line = target ${pct(g.target, 0)}`));
  const toggle = el('button', 'toggle'); toggle.type = 'button'; toggle.setAttribute('aria-pressed', 'false'); toggle.append(icon('table', 'ico-16'), 'Table');
  head.append(txt, toggle);

  const data = SERIES[g.id].slice(0, runIdx + 1).map(([k, n], i) => ({ i, v: k / n, k, n, date: RUNS[i].date }));
  const lo = g.id === 'G4' ? 0.9 : 0.7, hi = 1;
  const W = 320, H = 168, m = { t: 20, r: 12, b: 24, l: 36 };
  const x = i => m.l + (data.length === 1 ? 0 : i * (W - m.l - m.r) / (data.length - 1));
  const y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);
  const NS = 'http://www.w3.org/2000/svg';
  const s = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.append(e); return e; };

  const chart = el('div', 'chart'); chart.tabIndex = 0; chart.setAttribute('role', 'group');
  const latest = data[data.length - 1], first = data[0];
  chart.setAttribute('aria-label', `${g.name}: ${pct(first.v)} on ${first.date} to ${pct(latest.v)} on ${latest.date}; target ${pct(g.target, 0)}. Use left and right arrow keys to read each run.`);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, 'aria-hidden': 'true' }, null);
  const grid = s('g', { class: 'grid' }, svg), axis = s('g', { class: 'axis' }, svg);
  const ticks = g.id === 'G4' ? [0.9, 0.95, 1] : [0.7, 0.8, 0.9, 1];
  ticks.forEach(t => { s('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t) }, grid); const tx = s('text', { x: m.l - 6, y: y(t) + 4, 'text-anchor': 'end' }, axis); tx.textContent = pct(t, 0); });
  const xl = s('text', { x: x(0), y: H - 4, 'text-anchor': 'start' }, axis); xl.textContent = first.date.replace(/ 2026$/, '');
  if (data.length > 1) { const xr = s('text', { x: x(latest.i), y: H - 4, 'text-anchor': 'end' }, axis); xr.textContent = latest.date.replace(/ 2026$/, ''); }
  // target reference: solid hairline + label (not a series)
  s('line', { class: 'target-line', x1: m.l, x2: W - m.r, y1: y(g.target), y2: y(g.target) }, svg);
  // The target hairline is named in the subtitle: on-plot labels collide with the series when the target sits at the axis edge
  s('path', { class: 'series', d: data.map((p, i) => `${i ? 'L' : 'M'}${x(p.i)},${y(p.v)}`).join('') }, svg);
  s('circle', { class: 'end-dot', cx: x(latest.i), cy: y(latest.v), r: 4 }, svg);
  const el2 = s('text', { class: 'end-label', x: x(latest.i), y: y(latest.v) - 10, 'text-anchor': 'end' }, svg); el2.textContent = pct(latest.v);
  const xh = s('line', { class: 'xhair', y1: m.t, y2: H - m.b, visibility: 'hidden' }, svg);
  const hd = s('circle', { class: 'hover-dot', r: 4.5, visibility: 'hidden' }, svg);
  chart.append(svg);
  const tip = el('div', 'tip'); tip.hidden = true; chart.append(tip);

  let cur = null;
  const showAt = (i) => {
    cur = i; const p = data[i];
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
    hd.setAttribute('cx', x(i)); hd.setAttribute('cy', y(p.v)); hd.setAttribute('visibility', 'visible');
    tip.replaceChildren(el('strong', null, `${pct(p.v)}  (${p.k} / ${p.n})`), document.createTextNode(p.date));
    const rect = svg.getBoundingClientRect(), sx = rect.width / W;
    tip.style.left = Math.min(Math.max(x(i) * sx, 70), rect.width - 70) + 'px'; tip.style.top = (y(p.v) * sx - 10) + 'px'; tip.hidden = false;
  };
  const hide = () => { cur = null; xh.setAttribute('visibility', 'hidden'); hd.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  chart.addEventListener('pointermove', (e) => {
    const rect = svg.getBoundingClientRect(), px = (e.clientX - rect.left) * W / rect.width;
    let best = 0; data.forEach((p, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; }); showAt(best);
  });
  chart.addEventListener('pointerleave', hide);
  chart.addEventListener('focus', () => showAt(data.length - 1));
  chart.addEventListener('blur', hide);
  chart.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); showAt(Math.max(0, Math.min(data.length - 1, (cur ?? data.length - 1) + (e.key === 'ArrowRight' ? 1 : -1)))); }
    if (e.key === 'Escape') hide();
  });

  const table = el('table', 'trend-table'); table.hidden = true;
  table.append(el('caption', 'sr-only', `${g.name} by run`));
  const th = el('tr'); ['Run date', 'Result', 'Value'].forEach(t => th.append(el('th', null, t))); const thead = el('thead'); thead.append(th);
  const tb = el('tbody'); data.slice().reverse().forEach(p => { const tr = el('tr'); [p.date, `${p.k} / ${p.n}`, pct(p.v)].forEach(v => tr.append(el('td', null, v))); tb.append(tr); });
  table.append(thead, tb);
  toggle.addEventListener('click', () => { const on = toggle.getAttribute('aria-pressed') !== 'true'; toggle.setAttribute('aria-pressed', on); chart.hidden = on; table.hidden = !on; });

  card.setAttribute('aria-labelledby', hid);
  card.append(head, chart, table);
  return card;
}
function renderTrends(runIdx) {
  const root = $('#trends'); root.replaceChildren();
  GATES.filter(g => g.kind === 'ratio').forEach(g => root.append(trendChart(g, runIdx)));
}

/* ---------- wire up ---------- */
function render() {
  const idx = +runSel.value; const res = resultsFor(idx);
  renderMeta(RUNS[idx]); renderVerdict(res); renderGates(res); renderTrends(idx);
  lucide.createIcons();
}
runSel.addEventListener('change', render);

const root = document.documentElement, themeBtn = $('#theme');
const setTheme = t => { root.dataset.theme = t; themeBtn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'); themeBtn.replaceChildren(icon(t === 'dark' ? 'sun' : 'moon')); lucide.createIcons(); };
setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
themeBtn.addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));

const sidebar = $('#sidebar'), menu = $('#menu'), scrim = $('#scrim');
const setNav = open => { sidebar.classList.toggle('open', open); scrim.hidden = !open; menu.setAttribute('aria-expanded', open); if (open) $('a', sidebar).focus(); else menu.focus(); };
menu.addEventListener('click', () => setNav(true));
scrim.addEventListener('click', () => setNav(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sidebar.classList.contains('open')) setNav(false); });

render();
</script>
