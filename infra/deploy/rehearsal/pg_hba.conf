# Deployment rehearsal: network connections must use TLS (hostssl); plain `host` lines are absent on purpose,
# so a client without sslmode=require is refused. The local socket is for the image's init scripts only.
local    all  all                 trust
hostssl  all  all  0.0.0.0/0      scram-sha-256
hostssl  all  all  ::/0           scram-sha-256
