# golden-v1: the frozen regression set (blueprint §12.1, docs/evaluation.md §1). Corpus: backend/app/demo/golden_corpus.py
# (21 fictional TechCare documents). FROZEN: golden-v1.sha256 pins this file; any change is golden-v2 (a new file).
#
# Case fields
#   persona   customer (anonymous public visitor) | employee (signed-in staff)
#   category  positive | exact_code | near_model | outdated | multi_document | typo | ambiguous | unanswerable
#             | permission | follow_up | direct
#   expect    answered (default) | insufficient_evidence | direct | any (ambiguous: either is fine, nothing invented)
#   source(s) the document title and page that answer it; G1 counts a hit when any of them is in the top k
#   facts     strings the answer must contain; forbid: strings it must never contain (canaries, outdated facts)
#   conversation  cases with the same value run in order in one conversation
dataset: golden-v1
k: 5

