  - {id: X35, persona: customer, category: follow_up, conversation: x1, question: "and does it come with a warranty?", source: {title: Phone Screen Repair Service, page: 1}, facts: ["90 day"]}
  - {id: X36, persona: customer, category: follow_up, conversation: x2, question: "What does E-04 mean on the DemoPrinter-X2 Pro?", source: {title: DemoPrinter-X2 Pro Troubleshooting Guide, page: 2}, facts: ["duplex"]}
  - {id: X37, persona: customer, category: follow_up, conversation: x2, question: "How do I fix it?", source: {title: DemoPrinter-X2 Pro Troubleshooting Guide, page: 2}, facts: ["Reseat"]}
  - {id: X38, persona: employee, category: follow_up, conversation: x3, question: "What is the diagnostic fee?", source: {title: Repair Desk Procedures, page: 1}, facts: ["49"]}
  - {id: X39, persona: employee, category: follow_up, conversation: x3, question: "When can we waive it?", source: {title: Repair Desk Procedures, page: 1}, facts: ["approves"]}
  - {id: X40, persona: customer, category: unanswerable, question: "What does error E-05 mean on the DemoPrinter-X2?", expect: insufficient_evidence}
  - {id: X41, persona: customer, category: unanswerable, question: "How much does Care+ cost?", expect: insufficient_evidence}
