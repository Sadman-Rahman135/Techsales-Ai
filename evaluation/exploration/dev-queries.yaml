  - {id: X45, persona: customer, category: unanswerable, question: "What is the price of the DemoPrinter-X2 Pro?", expect: insufficient_evidence}
  - {id: X46, persona: customer, category: unanswerable, question: "How long does a laptop screen repair take?", expect: insufficient_evidence}
  - {id: X47, persona: customer, category: unanswerable, question: "Which error code means low ink on the DemoPrinter-X2?", expect: insufficient_evidence}
  - {id: X48, persona: customer, category: unanswerable, question: "What is the warranty on the E3 earbuds?", expect: insufficient_evidence}
  - {id: X49, persona: customer, category: unanswerable, question: "How many loyalty points do I earn per dollar?", expect: insufficient_evidence}
